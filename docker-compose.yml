services:
  db:
    image: mysql:8.4
    container_name: moodle-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle_password_2026
      MYSQL_ROOT_PASSWORD: moodle_root_2026
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umoodle", "-pmoodle_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 20

  moodle-php:
    build: .
    container_name: moodle-php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MOODLE_DATAROOT: /var/www/moodledata
      MOODLE_URL: http://192.168.1.16:3030
      MOODLE_DATABASE_TYPE: mysqli
      MOODLE_DATABASE_HOST: db
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: moodle_password_2026
      MOODLE_DATABASE_PORT: 3306
      DBPREFIX: mdl_
    volumes:
      - ./html:/var/www/html
      - moodle_data:/var/www/moodledata
    working_dir: /var/www/html
    expose:
      - "9000"

  nginx:
    image: nginx:stable-alpine
    container_name: moodle-nginx
    restart: unless-stopped
    depends_on:
      - moodle-php
    ports:
      - "3030:80"
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    image: redis:7-alpine
    container_name: moodle-redis
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru

volumes:
  db_data:
  moodle_data:
